name: Gerar APK do PULSAR

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pulsar-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Baixar projeto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Preparar Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar código e estrutura
        run: npm run check

      - name: Sincronizar Android preservando plugins
        run: npm run android:sync

      - name: Compilar APK de teste
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace -PpulsarVersionCode="$((21000 + GITHUB_RUN_NUMBER))"

      - name: Preparar APK e checksum
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/PULSAR-2.1-teste.apk
          cd dist
          sha256sum PULSAR-2.1-teste.apk > SHA256SUMS.txt

      - name: Disponibilizar APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PULSAR-2.1-teste-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
